<!doctype html>
<!--
  GitHub Pages has no server-side rewrites, so a direct link to a client-side
  route (e.g. /CSA-Website/events) 404s on refresh. GitHub Pages serves this
  file for any unknown path — it re-encodes the path into a query string and
  redirects to index.html, which decodes it back (see the inline script in
  index.html) before React Router ever sees the URL.
  Standard technique: https://github.com/rafgraph/spa-github-pages
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BYU Cybersecurity Students Association</title>
    <script>
      var pathSegmentsToKeep = 1 // keep the "/CSA-Website" project-page segment
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
